substitutions:
  _IMAGE: europe-west1-docker.pkg.dev/$PROJECT_ID/protash/protash

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_IMAGE}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_IMAGE}

images:
  - ${_IMAGE}

# Runtime env (incl. DEEPSEEK_API_KEY) is applied by scripts/deploy-gcp.sh,
# which pulls the Doppler `protash/prd` config and runs `gcloud run deploy
# --env-vars-file`. No GCP Secret Manager involvement.
